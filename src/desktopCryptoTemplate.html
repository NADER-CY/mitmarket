<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #F4F6FA;
    }

    .carousel-wrapper {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Fixed 1080px x 460px container */
    .mitmarket-slide {
      position: relative;
      width: 100%;
      max-width: 1080px;
      height: 460px;
      min-height: 460px;
      max-height: 460px;
      background-color: #101216;
      border: 1px solid #293344;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Subtle Bitcoin & Ethereum geometric line background */
    .crypto-bg-art {
      position: absolute;
      right: -20px;
      top: -10px;
      width: 520px;
      height: 480px;
      pointer-events: none;
      opacity: 0.06;
      z-index: 0;
    }

    .slide-main-layout,
    .slide-footer {
      position: relative;
      z-index: 1;
    }

    /* GRID COLUMNS: 38% / 62% */
    .slide-main-layout {
      display: grid;
      grid-template-columns: minmax(0, 38fr) minmax(0, 62fr);
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    /* LEFT COLUMN */
    .left-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .category-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .category-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btc-icon-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #F7931A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(247, 147, 26, 0.35);
    }

    .category-text {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #929AAA;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: #15191F;
      border: 1px solid #293344;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #929AAA;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: #1d232c;
      color: #F4F6FA;
      border-color: #3e4c63;
    }

    .market-title {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      color: #F4F6FA;
      letter-spacing: -0.015em;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Probability headline */
    .odds-display-group {
      margin-bottom: 12px;
    }

    .prob-headline-box {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .prob-headline-val {
      font-size: 26px;
      font-weight: 800;
      color: #1463FF;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .prob-headline-label {
      font-size: 12px;
      font-weight: 700;
      color: #1463FF;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-left: 6px;
    }

    .prob-share-price {
      font-size: 13px;
      font-weight: 600;
      color: #929AAA;
      font-variant-numeric: tabular-nums;
    }

    /* Up / Down Buttons (Exact MitMarket Spec) */
    .action-button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .trade-btn {
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .trade-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .trade-btn:active {
      transform: translateY(0);
    }

    .btn-up {
      background: rgba(11, 186, 116, 0.12);
      border: 1px solid #0BBA74;
      color: #0BBA74;
    }

    .btn-down {
      background: rgba(255, 71, 97, 0.12);
      border: 1px solid #FF4761;
      color: #FF4761;
    }

    .btn-price {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Related markets - normal document flow exactly 14px below buttons */
    .related-markets-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .related-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #929AAA;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(41, 51, 68, 0.6);
    }

    .related-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(41, 51, 68, 0.35);
      min-width: 0;
    }

    .related-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .related-title {
      font-size: 12px;
      font-weight: 500;
      color: #F4F6FA;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .related-bullet {
      color: #929AAA;
      font-size: 13px;
      line-height: 1;
      flex-shrink: 0;
    }

    .related-prob {
      font-size: 12px;
      font-weight: 700;
      color: #F4F6FA;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* RIGHT COLUMN: CHART */
    .right-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
      padding-left: 6px;
    }

    .chart-legend-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid #293344;
      flex-shrink: 0;
    }

    .legend-indicators {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .legend-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .ind-up {
      background-color: #0BBA74;
      box-shadow: 0 0 6px rgba(11, 186, 116, 0.4);
    }

    .ind-down {
      background-color: #FF4761;
      box-shadow: 0 0 6px rgba(255, 71, 97, 0.4);
    }

    .legend-name {
      color: #929AAA;
      font-weight: 500;
    }

    .legend-val-up {
      color: #0BBA74;
      font-weight: 700;
    }

    .legend-val-down {
      color: #FF4761;
      font-weight: 700;
    }

    .legend-timeframe {
      font-size: 11px;
      font-weight: 700;
      color: #929AAA;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .chart-viewport {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      margin-top: 6px;
    }

    .chart-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .axis-label {
      font-size: 10px;
      fill: #929AAA;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .grid-line {
      stroke: #293344;
      stroke-dasharray: 3 4;
      stroke-width: 0.75;
      opacity: 0.75;
    }

    /* FOOTER BAR */
    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      padding-top: 14px;
      border-top: 1px solid #293344;
      flex-shrink: 0;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .stat-badge {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: #F4F6FA;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      color: #929AAA;
      font-weight: 600;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .footer-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background-color: #293344;
    }

    .closing-stat {
      color: #929AAA;
      font-size: 11.5px;
      font-weight: 500;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .carousel-pagination {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .page-pill {
      width: 18px;
      height: 5px;
      border-radius: 3px;
      background: #1463FF;
    }

    .page-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #293344;
    }

    .provider-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #F4F6FA;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .provider-logo {
      display: flex;
      align-items: center;
      color: #1463FF;
    }
