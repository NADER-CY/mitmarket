    .cyber-grid {
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }
    
    .card-glass {
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.85) 0%, rgba(11, 15, 25, 0.95) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
    }

    .pulse-dot {
      animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 4px #10B981); }
      50% { opacity: 0.4; transform: scale(0.85); filter: drop-shadow(0 0 1px #10B981); }
    }
  
    .chart-glow-cyan {
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.7));
    }
    .chart-glow-rose {
      filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.7));
    }
    .chart-glow-amber {
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.7));
    }
