name: Build desktop server package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package verified desktop release
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT
          tar -czf mitmarket-desktop.tar.gz dist
          sha256sum mitmarket-desktop.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mitmarket-desktop-server
          path: |
            mitmarket-desktop.tar.gz
            SHA256SUMS
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "desktop-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" mitmarket-desktop.tar.gz SHA256SUMS --title "Desktop build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --notes "Verified desktop server bundle from ${GITHUB_SHA}." --latest
